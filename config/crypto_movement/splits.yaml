schema_version: 1
timezone: UTC
history_years: [1, 3, 5]
validation_duration_days: 90
outer_test_frequency: quarterly
inner_selection:
  strategy: sole_chronological_holdout
  folds_per_outer_history: 1
  roles: [train, validation]
  randomized: false
purge_hours: 12
embargo_hours: 0
lockbox:
  access_default: deny
  authorization_required: true
windows:
  history_hours: 24
  primary:
    interval_minutes: 15
    steps: 96
  ablation:
    interval_minutes: 30
    steps: 48
  label_horizon_hours: 12
anchors:
  default_stride_minutes: 60
  allowed_stride_minutes: [15, 30, 60]
  overlap_handling_required_below_minutes: 60
  overlap_handling_options: [concurrency_weights, purged_sampling]
batching:
  order: [anchor_timestamp, symbol]
  contiguous_anchor_blocks: true
  random_row_sampler: false
manifests:
  schema_version: 1
  fold_path: outputs/crypto_movement/fold_manifest.parquet
  sample_batch_path: outputs/crypto_movement/batch_manifest_sample.parquet
